{% extends "base.html" %}

{% block title %}Login - SalchiManager Pro Time{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-body);">
  <div class="card" style="max-width: 400px; width: 100%; margin: 1rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <img src="https://gestion.salchimonster.com/images/logo.png" alt="Logo" style="height: 4rem; margin-bottom: 1rem;">
      <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main); margin: 0;">SalchiManager Pro Time</h1>
    </div>
    
    {% if error %}
    <div style="background: var(--danger-soft); border-left: 4px solid var(--danger); padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; color: var(--danger); font-weight: 500;">
      {{ error }}
    </div>
    {% endif %}
    
    <form method="post" action="/login">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" name="username" required autofocus>
      </div>
      
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" required>
      </div>
      
      <button type="submit" class="btn btn-primary btn-full">
        <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
      </button>
    </form>
  </div>
</div>
{% endblock %}
